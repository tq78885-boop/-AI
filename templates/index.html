<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>砸扣AI · 智能助手</title>
<style>
/* ========== 基础与主题变量 ========== */
:root {
  --accent: #0d9488;
  --accent-dark: #0b7a70;
  --accent-soft: #e6f4f2;
  --bg-main: #ffffff;
  --bg-soft: #f7f7f5;
  --border: #e7e7e4;
  --text-1: #1f2329;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --sidebar-bg: #191c22;
  --sidebar-hover: #232732;
  --sidebar-active: #2a3040;
  --sidebar-text: #d1d5db;
  --sidebar-text-dim: #8b93a1;
  --danger: #dc2626;
  --code-bg: #10141b;
  --radius: 14px;
  --shadow-1: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .05);
  --shadow-2: 0 8px 30px rgba(15, 23, 42, .12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: var(--text-1);
  background: var(--bg-main);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }

.app { display: flex; height: 100vh; height: 100dvh; }

/* ========== 侧边栏 ========== */
.sidebar {
  width: 264px; flex: none;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex; flex-direction: column;
  transition: margin-left .25s ease;
  z-index: 40;
}
.sidebar-header {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 14px 12px;
}
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-logo {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, #14b8a6, #0d9488 60%, #0f766e);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(13, 148, 136, .4);
}
.brand-name { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .5px; }
.brand-sub { font-size: 11px; color: var(--sidebar-text-dim); margin-top: 1px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--sidebar-text-dim);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--sidebar-hover); color: #fff; }

.new-chat-btn {
  margin: 4px 14px 12px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, .14);
  color: #fff; font-size: 14px; font-weight: 600;
  transition: background .15s, border-color .15s;
}
.new-chat-btn:hover { background: var(--sidebar-hover); border-color: rgba(255, 255, 255, .25); }

.conv-section-title {
  padding: 6px 18px; font-size: 11px; letter-spacing: 1px;
  color: var(--sidebar-text-dim); text-transform: uppercase;
}
.conv-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.conv-list::-webkit-scrollbar { width: 5px; }
.conv-list::-webkit-scrollbar-thumb { background: #3a4150; border-radius: 3px; }
.conv-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%; text-align: left;
  padding: 9px 10px; margin-bottom: 2px;
  border-radius: 9px;
  font-size: 13.5px; color: var(--sidebar-text);
  transition: background .15s;
  position: relative;
}
.conv-item:hover { background: var(--sidebar-hover); }
.conv-item.active { background: var(--sidebar-active); color: #fff; }
.conv-item.active::before {
  content: ""; position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 3px; border-radius: 2px; background: var(--accent);
}
.conv-item .conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-empty { padding: 18px 14px; font-size: 12.5px; color: var(--sidebar-text-dim); line-height: 1.7; }

.sidebar-footer { padding: 12px 14px 16px; border-top: 1px solid rgba(255, 255, 255, .08); }
.upload-btn {
  width: 100%;
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px; border-radius: 10px;
  background: rgba(13, 148, 136, .16);
  color: #5eead4; font-size: 13.5px; font-weight: 600;
  transition: background .15s;
}
.upload-btn:hover { background: rgba(13, 148, 136, .28); }
.upload-hint { margin-top: 8px; font-size: 11px; color: var(--sidebar-text-dim); line-height: 1.6; }

.sidebar-mask {
  display: none; position: fixed; inset: 0;
  background: rgba(15, 23, 42, .45); z-index: 35;
}

/* ========== 主区域 ========== */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-main); }
.topbar {
  height: 56px; flex: none;
  display: flex; align-items: center; gap: 12px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(8px);
}
.menu-btn { display: none; color: var(--text-2); }
.topbar-title {
  flex: 1; min-width: 0;
  font-size: 14.5px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.model-picker { display: flex; align-items: center; gap: 7px; }
.model-picker label { font-size: 12.5px; color: var(--text-2); }
.model-select {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--bg-soft) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%236b7280" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>') no-repeat right 10px center;
  border-radius: 9px;
  padding: 7px 28px 7px 12px;
  font-size: 13px; font-family: inherit; color: var(--text-1);
  cursor: pointer;
  transition: border-color .15s;
}
.model-select:hover { border-color: #cfd4d0; }

/* ========== 聊天滚动区 ========== */
.chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.chat-scroll::-webkit-scrollbar { width: 6px; }
.chat-scroll::-webkit-scrollbar-thumb { background: #d6d9d6; border-radius: 3px; }
.chat-inner { max-width: 820px; margin: 0 auto; padding: 10px 22px 30px; }

/* 欢迎页 */
.welcome { padding: 9vh 0 20px; text-align: center; animation: fadeUp .4s ease; }
.welcome-logo {
  width: 60px; height: 60px; margin: 0 auto 18px;
  border-radius: 17px;
  background: linear-gradient(135deg, #14b8a6, #0d9488 60%, #0f766e);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(13, 148, 136, .35);
}
.welcome h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
.welcome p { margin-top: 10px; font-size: 14px; color: var(--text-2); }
.suggest-grid {
  margin: 34px auto 0; max-width: 640px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  text-align: left;
}
.suggest-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-main);
  padding: 14px 16px;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.suggest-card:hover { border-color: #b9ded9; box-shadow: var(--shadow-1); transform: translateY(-1px); }
.suggest-card .s-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--text-1); }
.suggest-card .s-title svg { color: var(--accent); }
.suggest-card .s-desc { margin-top: 6px; font-size: 12.5px; color: var(--text-2); line-height: 1.6; }

/* 消息 */
.messages { display: flex; flex-direction: column; }
.msg { display: flex; gap: 13px; padding: 16px 0; animation: fadeUp .25s ease; }
.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  margin-top: 2px;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .msg-avatar { background: #374151; }
.msg.assistant .msg-avatar { background: linear-gradient(135deg, #14b8a6, #0f766e); }
.msg-body { min-width: 0; max-width: calc(100% - 46px); }
.msg.user .msg-body {
  background: var(--accent-soft);
  border-radius: 14px 4px 14px 14px;
  padding: 10px 15px;
  font-size: 14.5px; line-height: 1.75;
  white-space: pre-wrap; word-break: break-word;
}
.msg.assistant .msg-body { flex: 1; font-size: 14.5px; line-height: 1.8; padding-top: 3px; }
.msg-role { font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 4px; }
.msg.user .msg-role { display: none; }

/* 思考中动画 */
.typing { display: inline-flex; gap: 5px; padding: 8px 0; }
.typing i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); opacity: .5;
  animation: bounce 1.2s infinite;
}
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* 流式光标 */
.stream-cursor {
  display: inline-block; width: 8px; height: 16px;
  background: var(--accent); border-radius: 2px;
  vertical-align: -2px; margin-left: 2px;
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* 错误与提示气泡 */
.msg-error {
  margin-top: 6px; padding: 10px 14px;
  border: 1px solid #fecaca; background: #fef2f2;
  border-radius: 10px; color: var(--danger);
  font-size: 13px; line-height: 1.7;
}
.msg-note { margin-top: 6px; font-size: 12px; color: var(--text-3); }

/* ========== Markdown 渲染样式 ========== */
.md > *:first-child { margin-top: 0; }
.md > *:last-child { margin-bottom: 0; }
.md p { margin: 8px 0; word-break: break-word; }
.md h1, .md h2, .md h3, .md h4 { margin: 18px 0 8px; line-height: 1.4; font-weight: 700; }
.md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; } .md h4 { font-size: 15px; }
.md ul, .md ol { margin: 8px 0; padding-left: 24px; }
.md li { margin: 4px 0; word-break: break-word; }
.md a { color: var(--accent-dark); text-decoration: none; border-bottom: 1px solid rgba(13, 148, 136, .35); }
.md a:hover { border-bottom-color: var(--accent-dark); }
.md blockquote {
  margin: 10px 0; padding: 6px 14px;
  border-left: 3px solid var(--accent);
  background: var(--bg-soft); border-radius: 0 8px 8px 0;
  color: var(--text-2);
}
.md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.md code.inline {
  background: #eef1f4; border: 1px solid #e3e7ea;
  border-radius: 5px; padding: 1px 6px;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: .88em; color: #0f766e;
}
.md .code-block {
  margin: 12px 0; border-radius: 11px; overflow: hidden;
  background: var(--code-bg); box-shadow: var(--shadow-1);
}
.md .code-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px;
  background: #1a2029; color: #8b93a1;
  font-size: 12px;
}
.md .code-copy {
  display: flex; align-items: center; gap: 5px;
  color: #8b93a1; font-size: 12px;
  padding: 3px 8px; border-radius: 6px;
  transition: background .15s, color .15s;
}
.md .code-copy:hover { background: #2a3040; color: #e5e7eb; }
.md pre {
  padding: 13px 15px; overflow-x: auto;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 13px; line-height: 1.65; color: #dbe2ea;
}
.md pre::-webkit-scrollbar { height: 6px; }
.md pre::-webkit-scrollbar-thumb { background: #3a4150; border-radius: 3px; }
.md table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13.5px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
.md th { background: var(--bg-soft); font-weight: 600; }
.md tr:nth-child(even) td { background: #fbfbfa; }

/* ========== 输入区 ========== */
.composer-wrap { flex: none; padding: 8px 22px 14px; background: linear-gradient(to top, #fff 78%, rgba(255, 255, 255, 0)); }
.composer-inner { max-width: 820px; margin: 0 auto; }
.attach-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.attach-chips:empty { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg-soft);
  font-size: 12.5px; color: var(--text-2);
  animation: fadeUp .2s ease;
}
.chip .chip-name { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-1); font-weight: 500; }
.chip.ok { border-color: #b9ded9; background: var(--accent-soft); }
.chip.ok .chip-status { color: var(--accent-dark); }
.chip.err { border-color: #fecaca; background: #fef2f2; }
.chip.err .chip-status { color: var(--danger); }
.chip .chip-x { color: var(--text-3); padding: 1px; border-radius: 4px; }
.chip .chip-x:hover { color: var(--danger); }
.chip-spin {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid #cfe8e4; border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.composer {
  display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--bg-main);
  padding: 9px 10px 9px 8px;
  box-shadow: var(--shadow-1);
  transition: border-color .15s, box-shadow .15s;
}
.composer:focus-within { border-color: #9fd4cd; box-shadow: 0 0 0 3px rgba(13, 148, 136, .1), var(--shadow-1); }
.composer .attach-btn {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: background .15s, color .15s;
}
.composer .attach-btn:hover { background: var(--bg-soft); color: var(--accent-dark); }
.composer .voice-btn {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: background .15s, color .15s, box-shadow .2s;
}
.composer .voice-btn:hover { background: var(--bg-soft); color: var(--accent-dark); }
.composer .voice-btn.listening {
  background: var(--accent); color: #fff;
  animation: micRipple 1.6s ease-out infinite;
}
.composer .voice-btn.listening:hover { background: var(--accent-dark); }
.composer .voice-btn.listening svg { animation: micPulse 1.1s ease-in-out infinite; }
@keyframes micRipple {
  0% { box-shadow: 0 0 0 0 rgba(13, 148, 136, .4); }
  70% { box-shadow: 0 0 0 9px rgba(13, 148, 136, 0); }
  100% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0); }
}
@keyframes micPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
.composer textarea {
  flex: 1; min-width: 0;
  border: none; resize: none;
  font-family: inherit; font-size: 14.5px; line-height: 1.6;
  color: var(--text-1);
  max-height: 168px;
  padding: 6px 2px;
  background: transparent;
}
.composer textarea:focus { outline: none; }
.composer textarea::placeholder { color: var(--text-3); }
.send-btn {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: #fff;
  transition: background .15s, transform .1s, opacity .15s;
}
.send-btn:hover:not(:disabled) { background: var(--accent-dark); }
.send-btn:active:not(:disabled) { transform: scale(.94); }
.send-btn:disabled { background: #d1d5db; cursor: not-allowed; }
.send-btn.stop { background: #374151; }
.send-btn.stop:hover { background: #1f2937; }
.composer-hint { margin-top: 8px; text-align: center; font-size: 11.5px; color: var(--text-3); }
.composer-hint.live { color: var(--accent-dark); font-weight: 600; }

/* ========== Toast ========== */
.toast-wrap {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  z-index: 100; pointer-events: none;
}
.toast {
  padding: 9px 18px; border-radius: 10px;
  background: #1f2937; color: #f9fafb;
  font-size: 13px; box-shadow: var(--shadow-2);
  animation: toastIn .25s ease;
  max-width: 82vw;
}
.toast.ok { background: var(--accent-dark); }
.toast.err { background: var(--danger); }
.toast.hide { opacity: 0; transform: translateY(-8px); transition: all .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

/* ========== 响应式 ========== */
@media (max-width: 860px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    margin-left: -280px;
    box-shadow: var(--shadow-2);
  }
  .sidebar.open { margin-left: 0; }
  .sidebar-mask.show { display: block; }
  .menu-btn { display: flex; }
  .chat-inner { padding: 6px 14px 24px; }
  .composer-wrap { padding: 6px 12px 10px; }
  .suggest-grid { grid-template-columns: 1fr; }
  .model-picker label { display: none; }
  .welcome { padding-top: 5vh; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2z" fill="#fff"/><circle cx="19" cy="18" r="2.4" fill="#fff" opacity=".85"/></svg>
        </div>
        <div>
          <div class="brand-name">砸扣AI</div>
          <div class="brand-sub">Agentic Assistant</div>
        </div>
      </div>
      <button class="icon-btn" id="sidebarClose" title="收起侧栏" aria-label="收起侧栏">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </button>

    <div class="conv-section-title">历史对话</div>
    <div class="conv-list" id="convList">
      <div class="conv-empty">暂无历史对话<br>开始你的第一次提问吧</div>
    </div>

    <div class="sidebar-footer">
      <button class="upload-btn" id="uploadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        上传文档到知识库
      </button>
      <div class="upload-hint">支持 PDF / DOCX / TXT / MD / PY / CSV，上传后可直接提问文档内容（RAG 检索）</div>
    </div>
  </aside>
  <div class="sidebar-mask" id="sidebarMask"></div>

  <!-- ===== 主区域 ===== -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="打开侧栏" aria-label="打开侧栏">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">新的对话</div>
      <div class="model-picker">
        <label for="modelSelect">模型</label>
        <select class="model-select" id="modelSelect" aria-label="选择模型">
          <option value="gpt-5.6">gpt-5.6</option>
          <option value="gpt-5.6-sol">gpt-5.6-sol</option>
          <option value="gpt-5.6-terra">gpt-5.6-terra</option>
          <option value="gpt-5.6-luna">gpt-5.6-luna</option>
          <option value="gpt-5.4">gpt-5.4</option>
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="chat-latest">chat-latest</option>
        </select>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner">

        <!-- 欢迎页 -->
        <div class="welcome" id="welcome">

<script>
"use strict";
/* =====================================================
 * 砸扣AI 前端逻辑（原生 JS，无外部依赖）
 * 后端接口约定（FastAPI）：
 *   GET  /conversations            -> [{thread_id, title, updated_at}]
 *   GET  /history/{thread_id}      -> [{role, content}]
 *   POST /chat/stream                  -> 流式文本（SSE 或纯文本），JSON 入参 {message, thread_id, model}
 *   POST /upload                   -> multipart: file + thread_id，返回 {filename, chunks}
 * ===================================================== */

/* ---------- 全局状态 ---------- */
const state = {
  threadId: localStorage.getItem("zakou_thread_id") || uuid(),
  model: localStorage.getItem("zakou_model") || "gpt-5.6",
  conversations: [],
  sending: false,
  abortCtrl: null,
  nearBottom: true
};
localStorage.setItem("zakou_thread_id", state.threadId);

const $ = (id) => document.getElementById(id);
const els = {
  sidebar: $("sidebar"), mask: $("sidebarMask"),
  convList: $("convList"), topbarTitle: $("topbarTitle"),
  modelSelect: $("modelSelect"),
  chatScroll: $("chatScroll"), welcome: $("welcome"), messages: $("messages"),
  inputBox: $("inputBox"), sendBtn: $("sendBtn"), sendIcon: $("sendIcon"),
  attachChips: $("attachChips"), fileInput: $("fileInput"),
  voiceBtn: $("voiceBtn"), composerHint: $("composerHint"),
  toastWrap: $("toastWrap")
};

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ---------- Toast ---------- */
function toast(msg, type = "", duration = 2600) {
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  els.toastWrap.appendChild(t);
  setTimeout(() => {
    t.classList.add("hide");
    setTimeout(() => t.remove(), 320);
  }, duration);
}

/* ---------- HTML 转义（防 XSS） ---------- */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---------- 轻量 Markdown 渲染 ---------- */
function renderMarkdown(src) {
  if (!src) return "";
  const codeBlocks = [];
  let text = String(src).replace(/\r\n/g, "\n");

  // 1. 提取围栏代码块，占位保护
  text = text.replace(/```([\w+-]*)[ \t]*\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push({ lang: lang || "text", code: code.replace(/\n$/, "") });
    return "\u0000CODE" + idx + "\u0000";
  });

  // 2. 整体转义
  text = escapeHtml(text);

  // 3. 行内代码
  const inlineCodes = [];
  text = text.replace(/`([^`\n]+)`/g, (m, c) => {
    inlineCodes.push(c);
    return "\u0000INLINE" + (inlineCodes.length - 1) + "\u0000";
  });

  // 4. 行内格式：粗体 / 斜体 / 删除线 / 链接
  text = text
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
      if (/^(https?:\/\/|mailto:)/i.test(url)) {
        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + "</a>";
      }
      return label;
    });

  // 5. 逐行解析块级元素
  const lines = text.split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // 代码块占位
    const codeMatch = line.match(/^\u0000CODE(\d+)\u0000\s*$/);
    if (codeMatch) {
      const b = codeBlocks[Number(codeMatch[1])];
      out.push(
        '<div class="code-block"><div class="code-head"><span>' + escapeHtml(b.lang) +
        '</span><button class="code-copy" type="button">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>' +
        '复制</button></div><pre><code>' + escapeHtml(b.code) + "</code></pre></div>"
      );
      i++; continue;
    }

    // 表格
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const splitRow = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
      const head = splitRow(line);
      let j = i + 2;
      const rows = [];
      while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])) { rows.push(splitRow(lines[j])); j++; }
      let html = "<table><thead><tr>" + head.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
      rows.forEach((r) => { html += "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>"; });
      html += "</tbody></table>";
      out.push(html);
      i = j; continue;
    }

    // 标题
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { const lv = h[1].length; out.push("<h" + lv + ">" + h[2] + "</h" + lv + ">"); i++; continue; }

    // 分隔线
    if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

    // 引用
    if (/^\s*&gt;\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*&gt;\s?/, "")); i++;
      }
      out.push("<blockquote>" + buf.join("<br>") + "</blockquote>");
      continue;
    }

    // 无序列表
    if (/^\s*[-*+]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        buf.push("<li>" + lines[i].replace(/^\s*[-*+]\s+/, "") + "</li>"); i++;
      }
      out.push("<ul>" + buf.join("") + "</ul>");
      continue;
    }

    // 有序列表
    if (/^\s*\d+[.、)]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*\d+[.、)]\s+/.test(lines[i])) {
        buf.push("<li>" + lines[i].replace(/^\s*\d+[.、)]\s+/, "") + "</li>"); i++;
      }
      out.push("<ol>" + buf.join("") + "</ol>");
      continue;
    }

    // 空行
    if (/^\s*$/.test(line)) { i++; continue; }

    // 普通段落（合并连续非空行）
    const buf = [line];
    i++;
    while (
      i < lines.length && !/^\s*$/.test(lines[i]) &&
      !/^(#{1,4}\s|&gt;|\s*[-*+]\s|\s*\d+[.、)]\s|\u0000CODE)/.test(lines[i]) &&
      !/^\s*\|.*\|\s*$/.test(lines[i]) && !/^\s*(---+|\*\*\*+)\s*$/.test(lines[i])
    ) { buf.push(lines[i]); i++; }
    out.push("<p>" + buf.join("<br>") + "</p>");
  }

  let html = out.join("");
  // 6. 还原行内代码
  html = html.replace(/\u0000INLINE(\d+)\u0000/g, (m, n) => '<code class="inline">' + inlineCodes[Number(n)] + "</code>");
  return html;
}

/* ---------- 滚动控制 ---------- */
els.chatScroll.addEventListener("scroll", () => {
  const gap = els.chatScroll.scrollHeight - els.chatScroll.scrollTop - els.chatScroll.clientHeight;
  state.nearBottom = gap < 90;
});
function scrollBottom(force) {
  if (force || state.nearBottom) {
    els.chatScroll.scrollTop = els.chatScroll.scrollHeight;
  }
}

/* ---------- 消息 DOM ---------- */
function addMessageEl(role, content) {
  els.welcome.style.display = "none";
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  if (role === "user") {
    avatar.textContent = "我";
  } else {
    avatar.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2z" fill="#fff"/></svg>';
  }

  const body = document.createElement("div");
  body.className = "msg-body";
  if (role === "assistant") {
    const name = document.createElement("div");
    name.className = "msg-role";
    name.textContent = "砸扣AI";
    body.appendChild(name);
  }
  const contentEl = document.createElement("div");
  contentEl.className = role === "assistant" ? "md" : "";
  if (role === "user") {
    contentEl.textContent = content;
  } else {
    contentEl.innerHTML = content ? renderMarkdown(content) : '<div class="typing"><i></i><i></i><i></i></div>';
  }
  body.appendChild(contentEl);
  wrap.appendChild(avatar);
  wrap.appendChild(body);
  els.messages.appendChild(wrap);
  scrollBottom(true);
  return { wrap, body, contentEl };
}

/* 代码复制（事件委托） */
els.messages.addEventListener("click", (e) => {
  const btn = e.target.closest(".code-copy");
  if (!btn) return;
  const pre = btn.closest(".code-block").querySelector("pre");
  const code = pre ? pre.textContent : "";
  const done = () => {
    btn.innerHTML = "已复制";
    setTimeout(() => {
      btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>复制';
    }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
  } else {
    fallbackCopy(code, done);
  }
});
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (err) { toast("复制失败", "err"); }
  ta.remove();
}

/* ---------- 会话列表 ---------- */
async function loadConversations() {
  try {
    const res = await fetch("/conversations");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.conversations || []);
    state.conversations = list.map((c) => ({
      thread_id: c.thread_id || c.id,
      title: c.title || "New Chat",
      updated_at: c.updated_at || ""
    }));
    renderConvList();
  } catch (err) {
    // 接口未实现或网络异常时静默降级，不打断使用
    renderConvList();
  }
}

function renderConvList() {
  els.convList.innerHTML = "";
  if (!state.conversations.length) {
    const d = document.createElement("div");
    d.className = "conv-empty";
    d.innerHTML = "暂无历史对话<br>开始你的第一次提问吧";
    els.convList.appendChild(d);
    return;
  }
  state.conversations.forEach((c) => {
    const btn = document.createElement("button");
    btn.className = "conv-item" + (c.thread_id === state.threadId ? " active" : "");
    btn.innerHTML =
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' +
      '<span class="conv-title"></span>';
    btn.querySelector(".conv-title").textContent = c.title;
    btn.title = c.title;
    btn.addEventListener("click", () => openConversation(c.thread_id, c.title));
    els.convList.appendChild(btn);
  });
}

async function openConversation(threadId, title) {
  if (state.sending) { toast("正在回复中，请先停止生成", "err"); return; }
  if (voice.want || voice.listening) stopVoice(true);
  state.threadId = threadId;
  localStorage.setItem("zakou_thread_id", threadId);
  els.topbarTitle.textContent = title || "历史对话";
  els.messages.innerHTML = "";
  els.attachChips.innerHTML = "";
  els.welcome.style.display = "none";
  renderConvList();
  closeSidebar();
  try {
    const res = await fetch("/history/" + encodeURIComponent(threadId));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.messages || data.history || []);
    if (!list.length) {
      els.welcome.style.display = "";
    } else {
      list.forEach((m) => {
        const role = normalizeRole(m.role);
        if (role) addMessageEl(role, m.content || "");
      });
    }
    scrollBottom(true);
  } catch (err) {
    toast("加载历史记录失败：/history 接口不可用", "err");
    els.welcome.style.display = "";
  }
}

function normalizeRole(role) {
  const r = String(role || "").toLowerCase();
  if (r === "user" || r === "human") return "user";
  if (r === "assistant" || r === "ai" || r === "bot") return "assistant";
  return null; // system / tool 消息不展示
}

function newChat() {
  if (state.sending) { toast("正在回复中，请先停止生成", "err"); return; }
  if (voice.want || voice.listening) stopVoice(true);
  state.threadId = uuid();
  localStorage.setItem("zakou_thread_id", state.threadId);
  els.messages.innerHTML = "";
  els.attachChips.innerHTML = "";
  els.welcome.style.display = "";
  els.topbarTitle.textContent = "新的对话";
  renderConvList();
  closeSidebar();
  els.inputBox.focus();
}

/* ---------- 流式聊天 ---------- */
function setSending(on) {
  state.sending = on;
  els.sendBtn.classList.toggle("stop", on);
  els.sendBtn.title = on ? "停止生成" : "发送";
  els.sendBtn.setAttribute("aria-label", on ? "停止生成" : "发送");
  els.sendIcon.innerHTML = on
    ? '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>'
    : '<path d="M12 19V5M5 12l7-7 7 7"/>';
  updateSendState();
}

function updateSendState() {
  els.sendBtn.disabled = !state.sending && !els.inputBox.value.trim();
}

async function sendMessage(rawText) {
  const text = (rawText !== undefined ? rawText : els.inputBox.value).trim();
  if (!text || state.sending) return;
  if (voice.want || voice.listening) stopVoice(true);

  const isFirst = els.messages.children.length === 0;
  addMessageEl("user", text);
  els.inputBox.value = "";
  autosize();
  updateSendState();

  const ai = addMessageEl("assistant", "");
  setSending(true);
  state.abortCtrl = new AbortController();

  // 新会话：本地先插入一条会话记录，随后尝试与服务端同步
  if (isFirst) {
    const title = text.length > 40 ? text.slice(0, 40) + "..." : text;
    state.conversations = state.conversations.filter((c) => c.thread_id !== state.threadId);
    state.conversations.unshift({ thread_id: state.threadId, title, updated_at: new Date().toISOString() });
    els.topbarTitle.textContent = title;
    renderConvList();
  }

  let full = "";
  let renderPending = false;
  const scheduleRender = (streaming) => {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(() => {
      renderPending = false;
      ai.contentEl.innerHTML = renderMarkdown(full) + (streaming ? '<span class="stream-cursor"></span>' : "");
      scrollBottom(false);
    });
  };

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: state.threadId, model: state.model }),
      signal: state.abortCtrl.signal
    });
    if (!res.ok) {
      let detail = "请求失败：HTTP " + res.status;
      try {
        const j = await res.json();
        if (j && j.error) detail = String(j.error);
      } catch (err) { /* 非 JSON 错误体 */ }
      throw new Error(detail);
    }

    const ct = (res.headers.get("content-type") || "").toLowerCase();
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";
    let mode = ct.includes("text/event-stream") ? "sse" : (ct.includes("ndjson") || ct.includes("jsonl") ? "jsonl" : "auto");
    let sseData = [];

    const extractJson = (obj) => {
      if (typeof obj === "string") return obj;
      if (obj && typeof obj === "object") {
        const v = obj.content ?? obj.token ?? obj.delta ?? obj.text ?? obj.answer ?? obj.reply ?? obj.message;
        if (typeof v === "string") return v;
      }
      return "";
    };
    const handleSseEvent = () => {
      if (!sseData.length) return;
      const payload = sseData.join("\n");
      sseData = [];
      const trimmed = payload.trim();
      if (!trimmed || trimmed === "[DONE]") return;

      let obj = null;
      try { obj = JSON.parse(payload); } catch (err) { /* 纯文本 data */ }

      if (obj && typeof obj === "object" && !Array.isArray(obj)) {
        if (obj.error) throw new Error(String(obj.error));
        if (obj.done) return;
      }

      const piece = obj ? extractJson(obj) : payload;
      if (!piece) return;
      full += piece;
      scheduleRender(true);
    };
    const feedLine = (line) => {
      if (mode === "jsonl") {
        if (!line.trim()) return;
        try { full += extractJson(JSON.parse(line)); } catch (err) { full += line; }
        scheduleRender(true);
        return;
      }
      // SSE
      if (line.startsWith("data:")) { sseData.push(line.slice(5).replace(/^ /, "")); return; }
      if (line.startsWith("event:") || line.startsWith("id:") || line.startsWith(":")) return;
      if (line.trim() === "") handleSseEvent();
    };

    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      const piece = decoder.decode(chunk.value, { stream: true });
      if (mode === "auto") {
        buf += piece;
        if (/^\s*(data:|event:|:)/.test(buf)) {
          mode = "sse";
        } else if (!buf.includes("\n") && buf.length < 4096 && !ct.includes("json")) {
          // 还无法判断，先继续攒一点；纯文本短流也兼容
          full = buf;
          scheduleRender(true);
          continue;
        } else if (ct.includes("application/json")) {
          mode = "json";
          continue;
        } else {
          mode = "plain";
          full = buf;
          buf = "";
          scheduleRender(true);
          continue;
        }
      }
      if (mode === "sse" || mode === "jsonl") {
        buf += piece;
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).replace(/\r$/, "");
          buf = buf.slice(idx + 1);
          feedLine(line);
        }
      } else {
        full += piece;
        scheduleRender(true);
      }
    }
    // 收尾
    if (mode === "sse" || mode === "jsonl") {
      if (buf.trim()) feedLine(buf);
      handleSseEvent();
    }
    if (mode === "json" || (mode === "auto" && ct.includes("application/json"))) {
      try { full = extractJson(JSON.parse(full)) || full; } catch (err) { /* 保留原文 */ }
    }

    ai.contentEl.innerHTML = full ? renderMarkdown(full) : '<div class="msg-note">（模型未返回内容）</div>';
    scrollBottom(false);
    loadConversations();
  } catch (err) {
    if (err.name === "AbortError") {
      ai.contentEl.innerHTML = (full ? renderMarkdown(full) : "") + '<div class="msg-note">已停止生成</div>';
    } else {
      ai.contentEl.innerHTML =
        (full ? renderMarkdown(full) : "") +
        '<div class="msg-error">' + escapeHtml(err.message || "网络异常，请稍后重试") + "</div>";
      if (String(err.message).includes("Failed to fetch")) {
        ai.contentEl.querySelector(".msg-error").textContent = "无法连接后端服务，请确认已运行 python app.py";
      }
    }
  } finally {
    setSending(false);
    state.abortCtrl = null;
    els.inputBox.focus();
  }
}

/* ---------- 文档上传（RAG） ---------- */
const ALLOWED_EXT = [".pdf", ".docx", ".txt", ".md", ".py", ".csv"];
function pickFile() { els.fileInput.click(); }

els.fileInput.addEventListener("change", () => {
  const file = els.fileInput.files[0];
  els.fileInput.value = "";
  if (file) uploadFile(file);
});

async function uploadFile(file) {
  const ext = "." + (file.name.split(".").pop() || "").toLowerCase();
  if (!ALLOWED_EXT.includes(ext)) {
    toast("不支持的文件类型，仅支持 PDF / DOCX / TXT / MD / PY / CSV", "err");
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    toast("文件过大（限 20MB）", "err");
    return;
  }

  const chip = document.createElement("div");
  chip.className = "chip";
  chip.innerHTML =
    '<span class="chip-spin"></span><span class="chip-name"></span><span class="chip-status">解析入库中…</span>' +
    '<button class="chip-x" title="移除" aria-label="移除">' +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  chip.querySelector(".chip-name").textContent = file.name;
  chip.querySelector(".chip-x").addEventListener("click", () => chip.remove());
  els.attachChips.appendChild(chip);

  const spin = chip.querySelector(".chip-spin");
  const status = chip.querySelector(".chip-status");
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("thread_id", state.threadId);
    const res = await fetch("/upload", { method: "POST", body: fd });
    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try {
        const j = await res.json();
        const raw = j.message || j.detail;
        if (Array.isArray(raw)) {
          detail = raw.map((item) => item.msg || JSON.stringify(item)).join("；");
        } else if (raw) {
          detail = String(raw);
        }
      } catch (err) { /* ignore */ }
      throw new Error(detail);
    }
    const data = await res.json().catch(() => ({}));
    spin.remove();
    chip.classList.add("ok");
    status.textContent = data.chunks ? "已入库 · " + data.chunks + " 个分块" : "已入库";
    toast("文档「" + file.name + "」已加入知识库", "ok");
  } catch (err) {
    spin.remove();
    chip.classList.add("err");
    status.textContent = "上传失败：" + (err.message === "Failed to fetch" ? "后端未启动" : err.message);
  }
}

/* ---------- 输入框 ---------- */
function autosize() {
  els.inputBox.style.height = "auto";
  els.inputBox.style.height = Math.min(els.inputBox.scrollHeight, 168) + "px";
}
els.inputBox.addEventListener("input", () => { autosize(); updateSendState(); });
els.inputBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!state.sending) sendMessage();
  }
});
els.sendBtn.addEventListener("click", () => {
  if (state.sending) {
    if (state.abortCtrl) state.abortCtrl.abort();
  } else {
    sendMessage();
  }
});

/* ---------- 语音输入（Web Speech API，无后端依赖） ---------- */
const DEFAULT_PLACEHOLDER = "给砸扣AI发送消息…（Enter 发送，Shift+Enter 换行）";
const DEFAULT_HINT = "内容由 AI 生成，请注意甄别 · 文档上传后仅当前对话可检索";
const voice = { recog: null, want: false, listening: false, base: "", final: "", interim: "", discard: false };

function getRecognitionCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function buildRecognition() {
  const r = new (getRecognitionCtor())();
  r.lang = "zh-CN";
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onstart = () => { voice.listening = true; updateVoiceUI(); };

  r.onresult = (e) => {
    if (voice.discard) return;
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      const piece = res[0] ? res[0].transcript : "";
      if (res.isFinal) voice.final += piece;
      else interim += piece;
    }
    voice.interim = interim;
    els.inputBox.value = voice.base + voice.final + voice.interim;
    autosize();
    updateSendState();
    scrollBottom(false);
  };

  r.onerror = (e) => {
    const code = e.error || "";
    if (code === "not-allowed" || code === "service-not-allowed") {
      voice.want = false;
      toast("麦克风权限被拒绝，请在浏览器中允许本页面使用麦克风", "err", 3600);
    } else if (code === "audio-capture") {
      voice.want = false;
      toast("未检测到麦克风设备", "err", 3200);
    } else if (code === "network") {
      voice.want = false;
      toast(window.isSecureContext === false
        ? "语音识别需要 localhost 或 HTTPS 环境，当前地址不可用"
        : "语音识别服务网络异常，请稍后重试", "err", 3800);
    } else if (code !== "no-speech" && code !== "aborted") {
      toast("语音识别出错：" + code, "err");
    }
    updateVoiceUI();
  };

  r.onend = () => {
    voice.listening = false;
    if (voice.want) {
      // 浏览器检测到静音会自动断开，这里自动续听
      setTimeout(() => {
        if (!voice.want) return;
        try { r.start(); } catch (err) { voice.want = false; updateVoiceUI(); }
      }, 300);
      return;
    }
    updateVoiceUI();
  };
  return r;
}

function startVoice() {
  if (!getRecognitionCtor()) {
    toast("当前浏览器不支持语音识别，建议使用 Chrome / Edge", "err", 3600);
    return;
  }
  if (voice.want) { stopVoice(false); return; }
  if (state.sending) { toast("正在回复中，完成后可继续语音输入", "err"); return; }

  if (!voice.recog) voice.recog = buildRecognition();
  voice.discard = false;
  const cur = els.inputBox.value;
  voice.base = cur ? cur + (/[\s\n]$/.test(cur) ? "" : " ") : "";
  voice.final = "";
  voice.interim = "";
  voice.want = true;
  updateVoiceUI();
  try {
    voice.recog.start();
  } catch (err) {
    voice.want = false;
    updateVoiceUI();
    toast("语音识别启动失败，请重试", "err");
  }
}

/* discard=true：丢弃尚未落定的识别结果（直接 abort） */
function stopVoice(discard) {
  voice.discard = !!discard;
  voice.want = false;
  voice.interim = "";
  try {
    if (voice.recog) {
      if (discard && voice.recog.abort) voice.recog.abort();
      else voice.recog.stop();
    }
  } catch (err) { /* 已结束 */ }
  updateVoiceUI();
}

function updateVoiceUI() {
  const on = voice.want;
  els.voiceBtn.classList.toggle("listening", on);
  els.voiceBtn.setAttribute("aria-pressed", on ? "true" : "false");
  els.voiceBtn.title = on ? "结束语音输入" : "语音输入";
  els.inputBox.placeholder = on ? "正在聆听，请说话…（再次点击麦克风结束）" : DEFAULT_PLACEHOLDER;
  els.composerHint.textContent = on ? "语音识别中，说完后再次点击麦克风结束" : DEFAULT_HINT;
  els.composerHint.classList.toggle("live", on);
}

els.voiceBtn.addEventListener("click", startVoice);

/* ---------- 建议卡片 ---------- */
$("suggestGrid").addEventListener("click", (e) => {
  const card = e.target.closest(".suggest-card");
  if (card && !state.sending) sendMessage(card.dataset.q);
});

/* ---------- 侧栏开合 ---------- */
function openSidebar() { els.sidebar.classList.add("open"); els.mask.classList.add("show"); }
function closeSidebar() { els.sidebar.classList.remove("open"); els.mask.classList.remove("show"); }
$("menuBtn").addEventListener("click", openSidebar);
$("sidebarClose").addEventListener("click", closeSidebar);
els.mask.addEventListener("click", closeSidebar);

/* ---------- 其他绑定 ---------- */
$("newChatBtn").addEventListener("click", newChat);
$("uploadBtn").addEventListener("click", pickFile);
$("attachBtn").addEventListener("click", pickFile);
els.modelSelect.value = state.model;
els.modelSelect.addEventListener("change", () => {
  state.model = els.modelSelect.value;
  localStorage.setItem("zakou_model", state.model);
  toast("已切换模型：" + state.model);
});

/* ---------- 初始化 ---------- */
(function init() {
  // 若本地保存的会话在历史列表中，恢复其标题
  loadConversations().then(() => {
    const cur = state.conversations.find((c) => c.thread_id === state.threadId);
    if (cur) {
      els.topbarTitle.textContent = cur.title;
      openConversation(cur.thread_id, cur.title);
    }
  });
  autosize();
  updateSendState();
  updateVoiceUI();
  if (!getRecognitionCtor()) {
    els.voiceBtn.style.opacity = ".45";
    els.voiceBtn.title = "当前浏览器不支持语音输入（建议 Chrome / Edge）";
  }
  els.inputBox.focus();
})();
</script>
